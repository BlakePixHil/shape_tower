<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6EC3FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Shape Tower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
  <style>
    :root { --ink: #22183A; --sky: #6EC3FF; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); overscroll-behavior: none; }
    body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #app { position: absolute; inset: 0; }
    #app canvas { display: block; touch-action: none; }
  </style>
  <link rel="stylesheet" href="/src/view/splash.css">
</head>
<body>
  <div id="app"></div>
  <!-- The loading splash (src/view/splash.ts): paints before any script runs. -->
  <div id="splash" role="img" aria-label="Shape Tower is loading">
    <div class="sp-sky">
      <img class="sp-cloud sp-cloud-0" src="/assets/splash/cloud.webp" alt="" decoding="sync">
      <img class="sp-cloud sp-cloud-1" src="/assets/splash/cloud.webp" alt="" decoding="sync">
      <img class="sp-cloud sp-cloud-2" src="/assets/splash/cloud.webp" alt="" decoding="sync">
      <img class="sp-hills" src="/assets/splash/hills.webp" alt="" decoding="sync">
      <div class="sp-stack">
        <img class="sp-p0" src="/assets/splash/stack-Plank.webp" alt="">
        <img class="sp-p1" src="/assets/splash/stack-O.webp" alt="">
        <img class="sp-p2" src="/assets/splash/stack-T.webp" alt="">
        <img class="sp-p3" src="/assets/splash/stack-Domino.webp" alt="">
      </div>
    </div>
    <div class="sp-logo"><img src="/assets/splash/logo.webp" alt="" decoding="sync"></div>
    <div class="sp-fonts" aria-hidden="true"><b>Shape</b><i>Tower</i><u>Play</u></div>
  </div>
  <script type="module" src="/src/game.ts"></script>
</body>
</html>
