<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6EC3FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Shape Tower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
  <style>
    :root { --ink: #22183A; --sky: #6EC3FF; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); overscroll-behavior: none; }
    body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #app { position: absolute; inset: 0; }
    #app canvas { display: block; touch-action: none; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 700 22px 'Fredoka', system-ui, sans-serif; color: var(--ink); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">Stacking blocks…</div>
  <script type="module" src="/src/game.ts"></script>
</body>
</html>
